server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Plugin YouTube obligatoire depuis fin 2024 : la source YouTube intégrée
    # de Lavalink ne fonctionne plus de façon fiable sans lui.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"   # doit correspondre à LAVALINK_PASSWORD dans .env
    sources:
      # On désactive la source YouTube native : c'est le plugin qui la remplace.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW          # LOW = plus léger pour un Raspberry Pi
    trackStuckThresholdMs: 10000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 10000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    # MUSIC ne stream pas : il sert à ytmsearch. Le playback passe par TV/WEB/etc.
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_MUSIC
      - ANDROID_VR
      - WEB
      - MWEB
      - WEBEMBEDDED
    # Cipher YouTube : 1.18.2 n'extrait plus le player JS (sig function).
    # Instance publique, 10 req/s. Pour un serveur dédié : https://github.com/kikkia/yt-cipher
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "Hertz"
    # YouTube bloque les clients anonymes (« This video requires login »).
    # OAuth : compte brûleur recommandé. Au 1er lancement, suivre le code
    # dans les logs Lavalink (dev.lavalink.youtube.http.YoutubeOauth2Handler).
    # Ensuite coller le refreshToken ici et relancer.
    oauth:
      enabled: true
      # refreshToken: "colle-le-ici-après-le-flow"
      # skipInitialization: true
    # Alternative à OAuth (WEB / WEBEMBEDDED uniquement) :
    # pot:
    #   token: ""
    #   visitorData: ""

metrics:
  prometheus:
    enabled: false

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    "dev.lavalink.youtube.http.YoutubeOauth2Handler": INFO
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
